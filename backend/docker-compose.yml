services:
  db:
    image: postgres:16-alpine
    container_name: proteinoteka_db
    environment:
      POSTGRES_USER: proteinoteka_2026
      # Same variable and dev default as application.yml, so `docker-compose up` + `mvnw spring-boot:run`
      # work together. Only applies when the volume is first created.
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-proteinoteka_dev_local}
      POSTGRES_DB: proteinoteka
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: