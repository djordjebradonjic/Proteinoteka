spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/proteinoteka}
    username: ${DATABASE_USERNAME:proteinoteka_2026}
    password: ${DATABASE_PASSWORD:proteinoteka_dev_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  show-actuator: false

task:
  scheduling:
    enabled: true

scraping:
  schedule:
    enabled: true
  types:
    # Product families scraped besides protein (protein is always on). Kill switch and rollout control:
    # SCRAPING_TYPES_ENABLED=protein,creatine ; SCRAPING_TYPES_STORES_CREATINE=GymBeam,FitLab limits it to those stores.
    enabled: ${SCRAPING_TYPES_ENABLED:protein}
  stale:
    enabled: true
    max-removal-percent: 50

server:
  port: ${PORT:8080}

playwright:
  executable-path:
  proxy:
    enabled: ${PROXY_ENABLED:false}
    host: ${PROXY_HOST:geo.iproyal.com}
    port: ${PROXY_PORT:12321}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

admin:
  token: ${ADMIN_TOKEN:}

ratelimit:
  # Per-IP limit on the public /api/v1 endpoints (see RateLimitFilter).
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  burst: ${RATE_LIMIT_BURST:60}
  # Shared secret the Next.js server sends as X-Internal-Token; empty = no bypass.
  bypass-token: ${RATE_LIMIT_BYPASS_TOKEN:}
  # Proxies in front of the app; the client IP is that many entries from the right of X-Forwarded-For.
  trusted-proxy-hops: ${RATE_LIMIT_PROXY_HOPS:1}

b2b:
  api:
    # Comma-separated list of valid B2B API keys. Set via env var B2B_API_KEYS.
    keys: ${B2B_API_KEYS:}

resend:
  api-key: ${RESEND_API_KEY:}
  from: "Proteinoteka <alerts@proteinoteka.rs>"

app:
  frontend-url: ${FRONTEND_BASE_URL:https://proteinoteka.rs}
  api-url: ${API_BASE_URL:http://localhost:8080}

# Optional GA4 overrides — set as env vars when needed:
#   ANALYTICS_CONVERSION_RATE=0.38
#   ANALYTICS_AVG_TIME_TO_CREATE_MS=2800