spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/proteinoteka}
    username: ${DATABASE_USERNAME:proteinoteka_2026}
    password: ${DATABASE_PASSWORD:proteinoteka_dev_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  show-actuator: false

task:
  scheduling:
    enabled: true

scraping:
  schedule:
    enabled: true
  stale:
    enabled: true
    max-removal-percent: 50

server:
  port: ${PORT:8080}

playwright:
  executable-path:
  proxy:
    enabled: ${PROXY_ENABLED:false}
    host: ${PROXY_HOST:geo.iproyal.com}
    port: ${PROXY_PORT:12321}
    username: ${PROXY_USERNAME:}
    password: ${PROXY_PASSWORD:}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

admin:
  token: ${ADMIN_TOKEN:}

b2b:
  api:
    # Comma-separated list of valid B2B API keys. Set via env var B2B_API_KEYS.
    keys: ${B2B_API_KEYS:}

resend:
  api-key: ${RESEND_API_KEY:}
  from: "Proteinoteka <alerts@proteinoteka.rs>"

app:
  frontend-url: ${FRONTEND_BASE_URL:https://proteinoteka.rs}
  api-url: ${API_BASE_URL:http://localhost:8080}

# Optional GA4 overrides — set as env vars when needed:
#   ANALYTICS_CONVERSION_RATE=0.38
#   ANALYTICS_AVG_TIME_TO_CREATE_MS=2800